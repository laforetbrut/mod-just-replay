org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ForgeGradle 7: classes and resources of the main source set share one output for the dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# Environment
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
forge_version=64.1.3
forge_version_range=[64,)
loader_version_range=[64,)

# Mod
mod_id=justreplay
mod_name=Just Replay
mod_license=Apache-2.0
mod_version=1.1.1
mod_group_id=com.vyrriox.justreplay
mod_authors=vyrriox
mod_description=Record, replay and edit your Minecraft sessions with a full cinematic editor.
