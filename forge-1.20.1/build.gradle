plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Minecraft 1.20.1 ships Java 17 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Loader-independent code for this Minecraft version lives in ../common on the main branch.
// On the per-target branches it is merged into src/main, so this block does nothing there.
def commonDir = file("../common/${minecraft_version}/src/main")
if (commonDir.isDirectory()) {
    sourceSets.main.java.srcDir(new File(commonDir, 'java'))
    sourceSets.main.resources.srcDir(new File(commonDir, 'resources'))
}

sourceSets.main.resources {
    exclude('**/*.bbmodel.license')
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${minecraft_version}"

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            // Dev runs load classes from folders, so the MixinConfigs entry of the jar manifest is not read here.
            args '--mixin.config', "${mod_id}.mixins.json",
                    '--mixin.config', "${mod_id}.compat.mixins.json",
                    '--mixin.config', "${mod_id}.forge.mixins.json"
            // The refmap holds SRG names; the dev game runs on Parchment names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        // The standard client run is also the self test run: -Pselftest adds the same settings as on the other targets.
        client {
            if (project.hasProperty('gameDir')) {
                workingDirectory project.property('gameDir')
            }
            if (project.hasProperty('selftest')) {
                property 'justreplay.selftest', 'true'
                jvmArgs '-Xmx8G'
                property 'justreplay.checkpointTicks', '60'
            }
            // Unattended recording of a world for test footage, see SceneRecorder.
            if (project.hasProperty('scene') || project.hasProperty('sceneReplay') || project.hasProperty('job')) {
                // Job file: several records, replays, screenshots and exports in one launch, see SceneJob.
                property 'justreplay.job', (project.findProperty('job') ?: '').toString()
                property 'justreplay.scene', (project.findProperty('scene') ?: '').toString()
                property 'justreplay.sceneReplay', (project.findProperty('sceneReplay') ?: '').toString()
                property 'justreplay.sceneExport', (project.findProperty('sceneExport') ?: '').toString()
                property 'justreplay.sceneShots', (project.findProperty('sceneShots') ?: '').toString()
                property 'justreplay.sceneEditor', (project.findProperty('sceneEditor') ?: '').toString()
                property 'justreplay.sceneCommands', (project.findProperty('sceneCommands') ?: '').toString()
                property 'justreplay.sceneSeconds', (project.findProperty('sceneSeconds') ?: '60').toString()
                property 'justreplay.sceneDelay', (project.findProperty('sceneDelay') ?: '5').toString()
                args '--width', '1600', '--height', '900'
                jvmArgs '-Xmx8G'
            }
        }

        server {
            args '--nogui'
        }
    }
}

// The annotation processor writes the refmap that maps Mojang/Parchment names in the mixins to SRG names.
mixin {
    add sourceSets.main, 'justreplay.refmap.json'
}

// MixinGradle writes the refmap outside the outputs of compileJava: a build cache hit restores the
// classes without it, and the jar ships with no refmap, which only breaks outside dev.
tasks.named('compileJava') {
    outputs.cacheIf { false }
}

repositories {
    mavenCentral()
    maven {
        name = 'Max Henkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroup 'de.maxhenkel.voicechat' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Simple Voice Chat API; optional at runtime. The 1.20.1 build of the mod ships API 2.5.x.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// The license file sits at the repository root on main and at the project root on a target branch.
def licenseFile = commonDir.isDirectory() ? file('../LICENSE') : file('LICENSE')
def licenseName = "LICENSE_${mod_id}"
tasks.named('jar', Jar).configure {
    from(licenseFile) {
        rename { licenseName }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                // Forge loads mixin configs listed here; there is no [[mixins]] table in mods.toml.
                'MixinConfigs'          : "${mod_id}.mixins.json,${mod_id}.compat.mixins.json,${mod_id}.forge.mixins.json"
        ])
    }
    // Forge 1.20.1 runs on SRG names outside of development: the jar is remapped after it is built.
    finalizedBy 'reobfJar'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
