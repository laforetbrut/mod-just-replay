plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Minecraft 26.1.2 ships Java 25 to players.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Loader-independent code for this Minecraft version lives in ../common on the main branch.
// On the per-target branches it is merged into src/main, so this block does nothing there.
def commonDir = file("../common/${minecraft_version}/src/main")
if (commonDir.isDirectory()) {
    sourceSets.main.java.srcDir(new File(commonDir, 'java'))
    sourceSets.main.resources.srcDir(new File(commonDir, 'resources'))
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            if (project.hasProperty('gameDir')) {
                gameDirectory = file(project.property('gameDir'))
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('selftest')) {
                systemProperty 'justreplay.selftest', 'true'
                jvmArgument '-Xmx8G'
                systemProperty 'justreplay.checkpointTicks', '60'
            }
            // Unattended recording of a world for test footage, see SceneRecorder.
            if (project.hasProperty('scene') || project.hasProperty('sceneReplay') || project.hasProperty('job')) {
                // Job file: several records, replays, screenshots and exports in one launch, see SceneJob.
                systemProperty 'justreplay.job', project.findProperty('job') ?: ''
                systemProperty 'justreplay.scene', project.findProperty('scene') ?: ''
                systemProperty 'justreplay.sceneReplay', project.findProperty('sceneReplay') ?: ''
                systemProperty 'justreplay.sceneExport', project.findProperty('sceneExport') ?: ''
                systemProperty 'justreplay.sceneShots', project.findProperty('sceneShots') ?: ''
                systemProperty 'justreplay.sceneEditor', project.findProperty('sceneEditor') ?: ''
                systemProperty 'justreplay.sceneCommands', project.findProperty('sceneCommands') ?: ''
                systemProperty 'justreplay.sceneSeconds', project.findProperty('sceneSeconds') ?: '60'
                systemProperty 'justreplay.sceneDelay', project.findProperty('sceneDelay') ?: '5'
                programArguments.addAll '--width', '1600', '--height', '900'
                jvmArgument '-Xmx8G'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Max Henkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroup 'de.maxhenkel.voicechat' }
    }
}

dependencies {
    // Simple Voice Chat API (the version bundled with voicechat 2.6.x); optional at runtime.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
