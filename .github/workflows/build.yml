name: Build

# Runs for a release (a version tag such as v1.1.0), for pull requests, and by hand from the
# Actions page. A plain push to a branch does not start it.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: neoforge-1.20.1
            java: 17
            launcher: 17
          - project: forge-1.20.1
            java: 17
            launcher: 17
          - project: fabric-1.20.1
            java: 17
            launcher: 21
          - project: neoforge-1.21.1
            java: 21
            launcher: 21
          - project: forge-1.21.1
            java: 21
            launcher: 21
          - project: fabric-1.21.1
            java: 21
            launcher: 21
          - project: neoforge-26.1.2
            java: 25
            launcher: 25
          - project: forge-26.1.2
            java: 25
            launcher: 25
          - project: fabric-26.1.2
            java: 25
            launcher: 25
    steps:
      - uses: actions/checkout@v4
      # On main every target is a folder; on a target branch the project sits at the root.
      - name: Locate project
        id: dir
        run: |
          if [ -d "${{ matrix.project }}" ]; then echo "path=${{ matrix.project }}" >> "$GITHUB_OUTPUT";
          elif [ "${GITHUB_REF_NAME}" = "${{ matrix.project }}" ]; then echo "path=." >> "$GITHUB_OUTPUT";
          else echo "path=" >> "$GITHUB_OUTPUT"; fi
      # The game is compiled with the "java" toolchain; Gradle itself runs on "launcher" (the last
      # version listed becomes JAVA_HOME). Fabric Loom needs Java 21 to run even for 1.20.1.
      - uses: actions/setup-java@v4
        if: steps.dir.outputs.path != ''
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.launcher }}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.dir.outputs.path != ''
      - name: Build
        if: steps.dir.outputs.path != ''
        working-directory: ${{ steps.dir.outputs.path }}
        run: chmod +x gradlew && ./gradlew build --no-build-cache --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: steps.dir.outputs.path != ''
        with:
          name: justreplay-${{ matrix.project }}
          path: ${{ steps.dir.outputs.path }}/build/libs/*.jar
